name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Python
        run: python3 --version

      - name: Compile
        run: python3 -m compileall -q macubuntu_app

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Accent engine self-test
        run: python3 macubuntu_app/assets/macubuntu_accent_engine.py --self-test

      - name: CLI smoke tests
        run: |
          ./macubuntu --version
          ./macubuntu --json audit > /tmp/macubuntu-audit.json
          python3 -m json.tool /tmp/macubuntu-audit.json >/dev/null
          ./macubuntu --json doctor > /tmp/macubuntu-doctor.json || true
          python3 -m json.tool /tmp/macubuntu-doctor.json >/dev/null
          ./macubuntu --json plan > /tmp/macubuntu-plan.json
          python3 -m json.tool /tmp/macubuntu-plan.json >/dev/null
